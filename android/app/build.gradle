plugins { id 'com.android.application' }
// Optional fresh output directory, useful on synced/locked Windows workspaces.
if (project.hasProperty('outputRoot')) {
    layout.buildDirectory.set(file(project.property('outputRoot')))
}
android {
    namespace 'hu.droidvideo'
    compileSdk 36
    defaultConfig {
        applicationId 'hu.droidvideo'
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
